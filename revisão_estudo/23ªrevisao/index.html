<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Selecione seu sayajin favorito </title>
    <style>
        * {
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        main {
            padding: 20px;
        }

        main h1 {
            font-size: 1.3em;
            font-weight: 900;
        }

        main iframe {
            background-color: gray;
            display: block;
            border-radius: 10px;
            border: 1px solid #000000;
            width: 500px;
            height: 300px;
            margin: auto;
        }

        main nav {
            background-color: #252525;
            display: flex;
            justify-content: center;
            gap: 20px;
            border: 1px solid #ffffff65;
            border-radius: 5px;
            width: 500px;
            margin: auto;
            margin-top: 50px;
            padding: 10px;
        }

        nav a {
            color: #ffffff;
            font-size: 0.9em;
            font-weight: bold;
            text-transform: uppercase;
            text-decoration: none;
            border-radius: 10px;
            padding: 10px;
            transition: 0.3s;
        }

        nav a:hover {
            color: #252525;
            background-color: #808080;
        }
    </style>
</head>
<body>
    <main>
        <h1>Selecione logo abaixo: </h1>

        <iframe src="" name="frame" aria-placeholder="Seu Personagem era exibido aqui">
            seu navegador não é compatível com isso!!!
        </iframe>

        <nav>
            <a href="" target="frame">Son Goku</a>
            <a href="" target="frame">Vegeta</a>
            <a href="" target="frame">Son Gohan</a>
        </nav>
    </main>
</body>
</html>
