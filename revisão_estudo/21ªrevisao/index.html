<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Navbar </title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #1f1f1f;
            position: relative;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background-color: #1f1f1f;
            border-bottom: 0.5px solid #ffffff82;
            padding: 20px;
            padding-left: 50px;
            padding-right: 50px;
            display: flex;
            align-items: center;
        }

        header h2 {
            background-image: linear-gradient(to right, white 40%, red);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-family: Arial, Helvetica, sans-serif;
        }

        header nav {
            margin-left: auto;
            display: flex;
            gap: 30px;
        }

        header nav a {
            position: relative;
            color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
            font-weight: bold;
            font-size: 12px;
            text-decoration: none;
            
        }

        header nav a::after {
            position: absolute;
            content: "";
            width: 0;
            bottom: 0;
            left: 0;
            height: 1px;
            background-color: #ffffff;
            transition: width 0.5s ease;
        }

        header nav a:hover::after {
            width: 100%;
        }
    </style>
</head>
<body>
    <header>
        <h2> Animes </h2>

        <nav>
            <a href="">Pagina principal</a>
            <a href=""> categorias </a>
            <a href="">Sobre Nós</a>
        </nav>
    </header>
</body>
</html>
