<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Praticando vários tipos de unputs em formulários </title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

    </style>
</head>
<body>
    <h1> INPUTS </h1>

    <form action="cadastro.php" method="POST" autocomplete="on">
        <h2> input:text </h2>

        <p>
            <label for="inome">Nome:</label>
            <input type="text" name="nome" id="inome" placeholder="Informe seu nome" size="35" autocomplete="username" required>
        </p>

        <p>
            <label for="isobre">Sobrenome:</label>
            <input type="text" name="sobrenome" id="isobre" placeholder="Informe seu sobrenome" size="35" autocomplete="username" required>
        </p>

        <h2> input:password </h2>

        <p>
            <label for="isen">Senha:</label>
            <input type="password" name="senha" id="isen" placeholder="Digite sua senha" size="30" autocomplete="current-password" minlength="5" maxlength="10" required>
        </p>

        <h2> input:number </h2>

        <p>
            <label for="inum">Média:</label>
            <input type="number" name="numero" id="inum" value="2" step="0.5" min="2" max="10">
        </p>

        <h2> input:month </h2>

        <p>
            <label for="imes"> Ano e Mês do Aniversário: </label>
            <input type="month" name="mes" id="imes" value="2007-01" required>
        </p>

        <h2> input:date </h2>

        <p>
            <label for="ida">Data de Nascimento:</label>
            <input type="date" name="data" id="ida">
        </p>

        <h2> input:time </h2>

        <p>
            <label for="itime">Hora que nasceu:</label>
            <input type="time" name="hora" id="itime">
        </p>

        <h2> input:email </h2>

        <p>
            <label for="iEmail">E-mail:</label>
            <input type="email" name="email" id="iEmail">
        </p>

        <h2> input:file </h2>

        <p>
            <label for="ifile">Arquivo:</label>
            <input type="file" name="file" id="ifile">
        </p>

        <h2> input:search </h2>

        <p>
            <label for="ipes">Pesquisa:</label>
            <input type="search" name="pesquisa" id="ipes">
        </p>

        <h2> input:url </h2>

        <p>
            <label for="iurl">Url:</label>
            <input type="url" name="url" id="iurl">
        </p>

        <p>
            <input type="reset" value="Limpar">
            <input type="submit" value="Enviar">
        </p>

    </form>
</body>
</html>
