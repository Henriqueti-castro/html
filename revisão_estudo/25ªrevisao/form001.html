<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Praticando vários tipos de unputs em formulários </title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
    </style>
</head>
<body>
    <h1> INPUTS </h1>

    <form action="cadastro.php" method="POST" autocomplete="on">
        <h2> input:text, input:reset, input:submit </h2>

        <p>
            <label for="inome">Nome:</label>
            <input type="text" name="nome" id="inome" placeholder="Informe seu nome" size="35" autocomplete="username" required>
        </p>

        <p>
            <label for="isobre">Sobrenome:</label>
            <input type="text" name="sobrenome" id="isobre" placeholder="Informe seu sobrenome" size="35" autocomplete="username" required>
        </p>

        <h2> input:password </h2>

        <p>
            <label for="isen">Senha:</label>
            <input type="password" name="senha" id="isen" placeholder="Digite sua senha" size="30" autocomplete="current-password" minlength="5" maxlength="10" required>
        </p>

        <p>
            <input type="reset" value="Limpar">
            <input type="submit" value="Enviar">
        </p>

    </form>
</body>
</html>
