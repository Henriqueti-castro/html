<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudos elementos</title>

    <style>
            h1::before{
                content: "";
                display: block;
                width: 1000px;
                height: 3px;
                background-color: black;
                margin-top: 5px;
            }
    </style>
</head>
<body>
    <h1>praticando pseudo-elementos</h1>

    <p>Meu Pauzão</p>
</body>
</html>
