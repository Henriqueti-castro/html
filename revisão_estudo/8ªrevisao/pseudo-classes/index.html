<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo Elementos</title>
</head>
<style>
    a:link{
        color: #008000;
    }

    a:visited{
        color: #800080;
    }

    a:hover{
        color: #ff0000;
    }

    a:active{
        color: #0000ff;
    }
</style>
<body>
    <h1>Pseudo elementos visited e active em CSS</h1>

    <ul>
        <li><a href="https://www.youtube.com/">You Tube</a></li>
        <li><a href="https://github.com/">Github</a></li>
    </ul>
</body>
</html>
