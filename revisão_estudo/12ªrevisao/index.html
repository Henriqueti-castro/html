<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video responsivo 2</title>
</head>
<style>
    *{
        margin: 0px;
        padding: 0px;
    }
    h1{
        color: white;
        background-color: black;
        text-align: center;
        margin-bottom: 100px;
    }
    main{
        display: block;
        margin: auto;
        padding: 20px;
        max-width: 700px;
        min-width: 300px;
        box-shadow: 2px 2px 7px black;
    }

    main div{
        position: relative;
        background-color: green;
        margin: 0px -20px 0px -20px;
        box-sizing: border-box;
        padding: 10px;
        padding-bottom: 48%;
    }

    iframe{
        position: absolute;
        top: 5%;
        left: 5%;
        width: 90%;
        height: 90%;
    }


</style>
<body>
    <h1>video responsivo 2</h1>

    <main>
        <div>
            <iframe width="560" height="315" src="https://www.youtube.com/embed/2uo1yJKBZ2k?si=tK9wJVOH_wFZptQ2" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        </div>
    </main>
</body>
</html>
