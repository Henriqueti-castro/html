<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            position: relative;
            background-color: #272727;
        }

        body::before {
  content: "";
  position: fixed;
  inset: -10%;
  z-index: -1;
  background:
    radial-gradient(38% 30% at 15% 12%, rgba(255, 106, 94, 0.26), transparent 60%),
    radial-gradient(45% 35% at 85% 8%, rgba(155, 140, 255, 0.24), transparent 65%),
    radial-gradient(40% 40% at 50% 100%, rgba(111, 211, 199, 0.20), transparent 70%);
  animation: aurora-drift 0.5s ease-in-out infinite alternate;
  pointer-events: none;
}

@keyframes aurora-drift {
0% { transform: translate3d(0, 0, 0) scale(1);
 }

100% { transform: translate3d(2%, -5%, 0) scale(2); 
}
}
    </style>
</head>
<body>
    
</body>
</html>
