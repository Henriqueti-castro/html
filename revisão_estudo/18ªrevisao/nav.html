<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Navbar </title>
    <style>
         * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
         }

         header {
            display: flex;
            align-items: center;
            background-color: #2f2f2f;
            height: 50px;
         }

         header h2 {
            color:  white;
            font-family: Arial, Helvetica, sans-serif;
            font-weight: bold;
            padding-left: 50px;
         }

         header nav {
            margin-left: auto;
            padding-right: 50px;
         }

         header nav > a {
            position: relative;
            color:  white;
            font-family: Arial, Helvetica, sans-serif;
            font-weight: bold;
            text-decoration: none;
            padding: 15px;
            transition: width 0.5s ease;
         }

         header nav > a::before {
            content: "";
            position: absolute;
            bottom: 0;
            width: 0;
            height: 1px;
            background-color: white;
            
         }

         header nav > a:hover {
            width: 100%;
         }
    </style>
</head>
<body>
    <header>
        <h2>Henrique</h2>

        <nav>
            <a href="">Mateus</a>
            <a href="">Charlean</a>
            <a href="">Yasmin</a>
        </nav>
    </header>
</body>
</html>
