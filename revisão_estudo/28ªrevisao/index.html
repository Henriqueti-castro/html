<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>datalist</title>
</head>
<body>
    <form action="cadastro.php" method="get" autocomplete="on">
        <label for="ihar">HARDWARE</label>
        <input type="text" name="har" id="ihar" list="lst">
        <datalist id="lst">
            <option value="pl">Placa de Vídeo</option>
            <option value="Sd">SSD</option>
            <option value="H">HD</option>
        </datalist>
    </form>
</body>
</html>
