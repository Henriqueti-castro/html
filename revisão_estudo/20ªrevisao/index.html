<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Tabelas </title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            border-collapse: collapse;
            margin: auto;
        }

        caption {
            font-weight: bold;
            padding: 15px;
            border: 1px solid black;
        }

        th{
            border: 1px solid black;
            padding: 10px;
        }

        td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }
    </style>
</head>
<body>
    <table>
        <caption> Vencedores de UEFA Champions League 2000 </caption>

        <thead>
            <tr>
                <th>Clubes</th>
                <th colspan="7">Vitórias</th>
                <th>Total</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <th>Real Madrid</th>
                <td>2000</td>
                <td>2002</td>
                <td>2014</td>
                <td>2016</td>
                <td>2017</td>
                <td>2018</td>
                <td>2024</td>
                <td>7</td>
            </tr>

            <tr>
                <th>Barcelona</th>
                <td>2006</td>
                <td>2009</td>
                <td>2011</td>
                <td>2015</td>
                <td></td>
                <td></td>
                <td></td>
                <td>4</td>
            </tr>

            <tr>
                <th>Bayern de Munique</th>
                <td>2001</td>
                <td>2013</td>
                <td>2020</td>
                <td></td>
                <td></td>
                <td></td>
                <td></td>
                <td>3</td>
            </tr>

            <tr>
                <th>Paris Saint-Germain</th>
                <td>2025</td>
                <td>2026</td>
                <td></td>
                <td></td>
                <td></td>
                <td></td>
                <td></td>
                <td>2</td>
            </tr>

            <tr>
                <th>Chelsea</th>
                <td>2012</td>
                <td>2021</td>
                <td></td>
                <td></td>
                <td></td>
                <td></td>
                <td></td>
                <td>2</td>
            </tr>

            <tr>
                <th>Liverpool</th>
                <td>2005</td>
                <td>2019</td>
                <td></td>
                <td></td>
                <td></td>
                <td></td>
                <td></td>
                <td></td>
            </tr>
        </tbody>
    </table>
</body>
</html>
