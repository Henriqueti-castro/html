<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela 004</title>
</head>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
    }

    table {
        margin: auto;
        width: 700px;
        height: 300px;
        border-collapse: collapse;
    }

    caption {
        color: white;
        background-color: black;
        font-weight: bold;
        font-size: 1.3em;
        border: 1px solid black;
        padding: 10px;
    }

    table th {
        border: 1px solid gray;
        padding: 10px;
    }

    table td {
        font-weight: 550;
        border: 1px solid black;
        padding-left: 5px;
    }

    table .center {
        text-align: center;
        font-weight: 900;
    }
</style>
<body>
    <table>
        <caption>Filmes Favoritos</caption>

        <thead>
            <tr>
                <th class="center">GRUPOS</th>
                <th class="center">NOMES</th>
                <th class="center" colspan="3">FILMES</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <th class="center" rowspan="3">Mulheres</th>
                <td>Ana Maria Santos</td>
                <td>Alien</td>
                <td>Rambo</td>
                <td>Vingadores</td>
            </tr>

            <tr>
                <td>Beatriz Souza</td>
                <td>Hulk</td>
                <td>Inception</td>
                <td>Batman</td>
            </tr>

            <tr>
                <td>Cláudia Melo</td>
                <td>Oblivion</td>
                <td>Matrix</td>
                <td>Big Hero</td>
            </tr>

            <tr>
                <th class="center" rowspan="3">Homens</th>
                <td>Bruno Mendonça</td>
                <td>Intocáveis</td>
                <td>Amnésia</td>
                <td>Gladiador</td>
            </tr>

            <tr>
                <td>Daniel Lourenço</td>
                <td>wall-E</td>
                <td>Oldboy</td>
                <td>Dangal</td>
            </tr>

            <tr>
                <td>Fabiano Mota</td>
                <td>Star Wars 5</td>
                <td>Taxi Driver</td>
                <td>Toy Story</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
